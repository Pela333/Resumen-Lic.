name: Resumen de Licitaciones

on:
  # El cron automatico en la nube se pausa para evitar el geobloqueo de IP de servidores estatales (COMPR.AR, CONTRAT.AR, PBAC, BORA).
  # La ejecucion programada oficial corre localmente en Windows (Task Scheduler) a las 08:00 AM con las 33 fuentes completas.
  # schedule:
  #   - cron: '25 10 * * 1,3,5'
  workflow_dispatch: # Permite dispararlo manualmente en cualquier momento desde la web de GitHub

permissions:
  contents: write # Necesario para poder guardar la base de datos de duplicados en el repositorio

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar recolección y envío de correo
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APLICACION: ${{ secrets.GMAIL_CLAVE_APLICACION }}
          MAIL_DESTINATARIOS: ${{ secrets.MAIL_DESTINATARIOS }}
        run: |
          python -m licitaciones

      - name: Guardar base de datos actualizada en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/licitaciones.db
          # Solo comitea si la base de datos cambió
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar registro de licitaciones [skip ci]" && git push)

      - name: Guardar PDF generado como respaldo en GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-generados
          path: salida/
          retention-days: 14
